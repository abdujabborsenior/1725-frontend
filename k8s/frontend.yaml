# ════════════════════════════════════════════════════════════════════════
# MYMarkaz FRONTEND — Kubernetes (bitta fayl: namespace + deployment + service).
#
# Xavfsizlik: `mymarkaz` namespace — klasterdagi BOSHQA loyihalarga tegilmaydi.
# Service ClusterIP (3330) — tashqariga chiqarish o'z ingress'ingiz orqali.
# NEXT_PUBLIC_* qiymatlar image BUILD paytida muhrlangan — runtime env kerak emas.
#
# ⚠️ IMAGE TAG QOIDASI: hech qachon `:latest` ishlatmang — `kubectl apply`
# matn o'zgarmasa rollout qilmaydi. CI har push'da aniq `sha-<commit>` teg
# push qiladi; yangilash:
#   kubectl -n mymarkaz set image deploy/mymarkaz-frontend web=ghcr.io/OWNER/REPO:TAG
#   kubectl -n mymarkaz rollout status deploy/mymarkaz-frontend
#
# Qo'llash:
#   kubectl apply -f k8s/frontend.yaml
#   kubectl -n mymarkaz rollout status deploy/mymarkaz-frontend
#
#   # GHCR private bo'lsa (backend bilan bitta secret yetarli):
#   kubectl -n mymarkaz create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io --docker-username=<user> --docker-password=<PAT>
#   (va quyidagi imagePullSecrets izohini oching)
# ════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Namespace
metadata:
  name: mymarkaz
  labels:
    app.kubernetes.io/part-of: mymarkaz
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mymarkaz-frontend
  namespace: mymarkaz
  labels:
    app.kubernetes.io/name: mymarkaz-frontend
    app.kubernetes.io/part-of: mymarkaz
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mymarkaz-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } # uzilishsiz yangilanish
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mymarkaz-frontend
        app.kubernetes.io/part-of: mymarkaz
    spec:
      # imagePullSecrets:
      #   - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # image'dagi `node` foydalanuvchisi
      containers:
        - name: web
          # ⚠️ `:latest` EMAS — yangilash `kubectl set image` bilan (fayl boshidagi oqim)
          image: ghcr.io/OWNER/REPO:TAG
          ports:
            - name: http
              containerPort: 3330
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      terminationGracePeriodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mymarkaz-frontend
  namespace: mymarkaz
  labels:
    app.kubernetes.io/part-of: mymarkaz
spec:
  type: ClusterIP # tashqariga chiqarish — o'z ingress'ingiz orqali (3330)
  selector:
    app.kubernetes.io/name: mymarkaz-frontend
  ports:
    - name: http
      port: 3330
      targetPort: http
