name: Deploy

# DOCKER'SIZ CD (frontend): build GitHub runner'da bo'ladi (serverga yuk 0),
# serverga faqat tayyor Next.js standalone artefakt boradi, pm2 ishga tushiradi.
# Xavfsizlik siyosati backend bilan bir xil:
#  - Oddiy push'da HECH QACHON avtomatik deploy yo'q.
#  - Faqat qo'lda (workflow_dispatch) yoki versiya tag (v*) da ishlaydi.
#  - Serverga chiqish: `production` environment tasdig'i (required reviewers)
#    + repo o'zgaruvchisi DEPLOY_ENABLED='true'. Aks holda xavfsiz skip.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Deploy qilinadigan git ref'
        default: main
        required: false
  push:
    branches: [main]
    tags: ['v*']

# Deploy'lar navbatda — bir-birini bekor qilmaydi (yarim deploy yo'q).
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── 1) Build (runner'da) — serverga hech qanday yuk tushmaydi ────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # NEXT_PUBLIC_* build paytida kodga muhrlanadi — prod API URL majburiy.
      # Repo Variables: NEXT_PUBLIC_API_URL (masalan https://api.mymarkaz.uz/api)
      - name: Guard — build konfiguratsiyasi to'liqligini tekshir
        run: |
          if [ -z "${{ vars.NEXT_PUBLIC_API_URL }}" ]; then
            echo "::error::Repo variable NEXT_PUBLIC_API_URL o'rnatilmagan (Settings → Variables)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (standalone)
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: npm run build

      # Standalone artefakt: server.js + minimal node_modules + static + public.
      - name: Artefakt yig'ish
        run: |
          mkdir -p out
          cp -r .next/standalone/. out/
          mkdir -p out/.next/static
          cp -r .next/static/. out/.next/static/
          if [ -d public ]; then cp -r public out/public; fi
          tar -czf front-build.tar.gz -C out .

      - uses: actions/upload-artifact@v4
        with:
          name: front-build
          path: front-build.tar.gz
          retention-days: 3

  # ── 2) Serverga deploy (gated: faqat aniq yoqilganda) ────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # DEPLOY_ENABLED='true' bo'lmasa — job o'tkazib yuboriladi (xato emas, skip).
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    # `production` environment — required reviewers qo'yilsa, qo'lda TASDIQ kutiladi.
    environment: production
    steps:
      - name: Guard — deploy sirlari to'liqligini tekshir
        run: |
          missing=""
          [ -n "${{ secrets.DEPLOY_HOST }}" ] || missing="$missing DEPLOY_HOST"
          [ -n "${{ secrets.DEPLOY_USER }}" ] || missing="$missing DEPLOY_USER"
          [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ] || missing="$missing DEPLOY_SSH_KEY"
          [ -n "${{ secrets.DEPLOY_PATH }}" ] || missing="$missing DEPLOY_PATH"
          if [ -n "$missing" ]; then
            echo "::error::Deploy sirlari yetishmayapti:$missing"
            exit 1
          fi
          echo "Barcha deploy sirlari mavjud."

      - uses: actions/download-artifact@v4
        with:
          name: front-build

      # Artefaktni serverga yuborish (faqat o'z papkasiga — boshqa loyihalarga tegilmaydi).
      - name: Artefaktni yuklash (scp)
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: front-build.tar.gz
          target: ${{ secrets.DEPLOY_PATH }}/incoming/

      # Atomar deploy: releases/<vaqt> → `current` symlink → pm2 restart.
      # Eski release saqlanadi (tez rollback: symlink'ni orqaga o'tkazish kifoya).
      - name: SSH deploy (unpack → pm2)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true # birinchi xatoda to'xta (yarim deploy yo'q)
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            REL="releases/$(date +%Y%m%d%H%M%S)"
            mkdir -p "$REL"
            tar -xzf incoming/front-build.tar.gz -C "$REL"
            rm -f incoming/front-build.tar.gz
            ln -sfn "$PWD/$REL" current
            # pm2 konfiguratsiyasi (idempotent: bor bo'lsa restart, yo'q bo'lsa start)
            cat > ecosystem.config.js <<'EOC'
            module.exports = {
              apps: [{
                name: 'mymarkaz-front',
                script: './current/server.js',
                time: true,
                env: { NODE_ENV: 'production', PORT: 3330, HOSTNAME: '127.0.0.1' },
              }],
            };
            EOC
            pm2 startOrRestart ecosystem.config.js --update-env
            pm2 save
            # Faqat oxirgi 3 ta release qoladi (disk to'lmasin)
            ls -1dt releases/* | tail -n +4 | xargs -r rm -rf
            echo "Deploy OK: $REL"
